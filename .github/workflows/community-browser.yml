name: Community browser checks
on: pull_request
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config=playwright.community.config.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/community-schemas.test.ts tests/community-actions.test.ts tests/forms.test.tsx
      - run: npm run test:e2e:data
