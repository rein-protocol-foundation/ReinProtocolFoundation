ain accountable for our mission and legal responsibilities.\u003c/p>\n\u003ch2 style=\"margin:26px 0 10px;font-family:Georgia,serif;font-size:25px;font-weight:normal;line-height:1.3;\">Join the conversation on Discord.\u003c/h2>\n\u003cp style=\"margin:0 0 18px;\">Meet other community members, ask questions, share learning materials, and exchange ideas about AI agents.\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#a83f22\" style=\"border:1px solid #a83f22;mso-padding-alt:13px 22px;\">\u003ca href=\"https://discord.gg/m8qnWv9XX\" style=\"display:inline-block;padding:13px 22px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.4;text-decoration:none;\">Join our Discord server →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"margin:18px 0 8px;\">\u003ca href=\"https://discord.gg/m8qnWv9XX\">\u003cimg src=\"https://rein-protocol.org/images/discord-invite-m8qnWv9XX.png\" width=\"164\" height=\"164\" alt=\"QR code to join the Rein Discord server\" style=\"display:block;border:0;width:164px;height:164px;\">\u003c/a>\u003c/p>\n\u003cp style=\"margin:0 0 22px;color:#75695e;font-size:12px;line-height:1.6;\">Scan to join on your phone, or open \u003ca href=\"https://discord.gg/m8qnWv9XX\" style=\"color:#a83f22;text-decoration:underline;\">https://discord.gg/m8qnWv9XX\u003c/a>.\u003c/p>\n\u003ch2 style=\"margin:26px 0 10px;font-family:Georgia,serif;font-size:25px;font-weight:normal;line-height:1.3;\">Start with what interests you.\u003c/h2>\n\u003cp style=\"margin:0 0 18px;\">\u003cstrong>Learn online.\u003c/strong> Explore our growing collection of free AI learning resources, research and practical guides, at your own pace.\u003cbr>\u003ca href=\"https://rein-protocol.org/community/learn\" style=\"color:#a83f22;text-decoration:underline;\">Explore learning resources →\u003c/a>\u003c/p>\n\u003cp style=\"margin:0 0 18px;\">\u003cstrong>Meet in person.\u003c/strong> We’re planning conversations and events at universities and professional venues, connecting researchers, founders and people from other fields. Check our events page as gatherings are announced.\u003cbr>\u003ca href=\"https://rein-protocol.org/community/gather\" style=\"color:#a83f22;text-decoration:underline;\">Visit the events page →\u003c/a>\u003c/p>\n\u003cp style=\"margin:0 0 18px;\">\u003cstrong>Help shape the community.\u003c/strong> Share a useful resource, suggest an activity or introduce a collaborator. If you’d like to help organize programs or take on an ongoing role, explore the Contributor path.\u003cbr>\u003ca href=\"https://rein-protocol.org/community/contribute/resources/submit\" style=\"color:#a83f22;text-decoration:underline;\">Share a resource\u003c/a> · \u003ca href=\"https://rein-protocol.org/community/contribute\" style=\"color:#a83f22;text-decoration:underline;\">Ways to contribute\u003c/a>\u003c/p>\n\u003cp style=\"margin:0 0 22px;\">You’re welcome across industries and experience levels. Most public resources and events are open without registration or a public profile.\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#a83f22\" style=\"border:1px solid #a83f22;mso-padding-alt:13px 22px;\">\u003ca href=\"https://rein-protocol.org/community\" style=\"display:inline-block;padding:13px 22px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.4;text-decoration:none;\">Explore the Rein community →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"margin:24px 0 18px;\">Have an idea or a question? Write to \u003ca href=\"mailto:admin@rein-protocol.org\" style=\"color:#a83f22;text-decoration:underline;\">admin@rein-protocol.org\u003c/a>.\u003c/p>\n\u003cp style=\"margin:0 0 20px;\">Warmly,\u003cbr>\u003cstrong>Rein Protocol Foundation\u003c/strong>\u003c/p>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:20px 24px 24px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.65;\">\n\u003cp style=\"margin:0 0 10px;\">You received this welcome email because you registered for the Rein community. Rein Protocol Foundation was incorporated in Oct 2026 in the STATE OF WYOMING as a nonprofit corporation and has obtained an EIN. Contact: admin@rein-protocol.org. Community registration does not confer legal membership or governance rights.\u003c/p>\n\u003cp style=\"margin:0;\">\u003ca href=\"https://rein-protocol.org/\" style=\"color:#75695e;\">rein-protocol.org\u003c/a> · \u003ca href=\"https://rein-protocol.org/privacy\" style=\"color:#75695e;\">Privacy\u003c/a>\u003c/p>\n\u003c/td>\u003c/tr>\u003c/table>\n\u003c!--[if mso]>\u003c/td>\u003c/tr>\u003c/table>\u003c![endif]-->\n\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>"},{"id":"contributor-welcome","title":"Contributor Welcome","group":"welcome","description":"仅供正式成为 Contributor 后使用。Slack 邀请由 API 生成；当前已备好模板，自动发送尚未接入。","variables":{"USER_NAME":"Alex Chen","SLACK_INVITE_URL":"演示邀请，不可使用"},"status":"待 Slack API 接入","source":"lib/email-templates.ts · contributorWelcomeTemplate","subject":"Welcome as a Rein Contributor","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Welcome as a Rein Contributor\u003c/title>\u003cstyle>@media only screen and (max-width:480px){.rein-brand{padding:16px 8px 16px 16px!important}.rein-logo-cell{width:48px!important}.rein-mark{width:48px!important;height:48px!important}.rein-wordmark{padding-left:10px!important;font-size:11px!important;letter-spacing:1px!important}.rein-bridge{height:80px!important;background-size:220px 110px!important}}\u003c/style>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background-color:#e8ddc8;color:#302a25;\">\n\u003cdiv style=\"display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;\">Welcome as a Rein Contributor. Join our Slack workspace to start collaborating.\u003c/div>\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#e8ddc8\">\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003c!--[if mso]>\u003ctable role=\"presentation\" width=\"640\" align=\"center\">\u003ctr>\u003ctd>\u003c![endif]-->\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#f5ead3\" style=\"max-width:640px;border:1px solid #d0c3ad;font-family:Arial,sans-serif;\">\n\u003ctr>\u003ctd style=\"border-bottom:1px solid #d5c7b1;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\n\u003ctd class=\"rein-brand\" width=\"65%\" valign=\"middle\" style=\"padding:24px;\">\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\n\u003ctd class=\"rein-logo-cell\" width=\"64\" valign=\"middle\">\u003ca href=\"https://rein-protocol.org/\">\u003cimg class=\"rein-mark\" src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"64\" height=\"64\" alt=\"Rein logo\" style=\"display:block;border:0;width:64px;height:64px;\">\u003c/a>\u003c/td>\n\u003ctd class=\"rein-wordmark\" valign=\"middle\" style=\"padding-left:16px;color:#302a25;font-size:16px;font-weight:bold;letter-spacing:2px;line-height:1.5;\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\n\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd class=\"rein-bridge\" width=\"35%\" height=\"112\" aria-hidden=\"true\" bgcolor=\"#f5ead3\" style=\"height:112px;background-image:url('https://rein-protocol.org/images/welcome-golden-gate-cover.jpg');background-repeat:no-repeat;background-position:10% 58%;background-size:300px 150px;font-size:0;line-height:0;\">&nbsp;\u003c/td>\n\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:28px 24px 20px;\">\n\u003cp style=\"margin:0 0 12px;color:#75695e;font-size:11px;letter-spacing:2px;line-height:1.5;\">WELCOME, CONTRIBUTOR\u003c/p>\n\u003ch1 style=\"margin:0;font-family:Georgia,serif;font-size:34px;font-weight:normal;line-height:1.18;color:#302a25;\">Let’s build the community together.\u003c/h1>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 24px 12px;font-size:15px;line-height:1.75;\">\n\u003cp style=\"margin:0 0 16px;\">Hello Alex Chen,\u003c/p>\n\u003cp style=\"margin:0 0 16px;\">Welcome as a Rein Protocol Foundation Contributor. Thank you for taking an active role in our community and helping move our shared work forward.\u003c/p>\n\u003ch2 style=\"margin:26px 0 10px;font-family:Georgia,serif;font-size:25px;font-weight:normal;line-height:1.3;\">Join the Contributor workspace.\u003c/h2>\n\u003cp style=\"margin:0 0 18px;\">We use Slack to coordinate projects, organize activities, and support each other. Use your invitation below to join, then introduce yourself and share what you would like to work on.\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#a83f22\" style=\"border:1px solid #a83f22;mso-padding-alt:13px 22px;\">\u003ca href=\"https://join.slack.com/t/rein/shared_invite/preview-not-valid\" style=\"display:inline-block;padding:13px 22px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.4;text-decoration:none;\">Join the Contributor Slack →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"margin:18px 0 22px;color:#75695e;font-size:12px;line-height:1.6;\">If the button does not work, \u003ca href=\"https://join.slack.com/t/rein/shared_invite/preview-not-valid\" style=\"color:#a83f22;text-decoration:underline;\">open your Slack invitation here\u003c/a>. If the invitation has expired, contact admin@rein-protocol.org for a new one.\u003c/p>\n\u003cp style=\"margin:0 0 16px;\">Start by connecting with the people involved in your contribution area and agreeing on a useful first step. You can explore \u003ca href=\"https://rein-protocol.org/community/contribute\" style=\"color:#a83f22;text-decoration:underline;\">ways to contribute\u003c/a> and read our \u003ca href=\"https://rein-protocol.org/community/code-of-conduct\" style=\"color:#a83f22;text-decoration:underline;\">Code of Conduct\u003c/a>.\u003c/p>\n\u003cp style=\"margin:24px 0 18px;\">Have a question or need a new invitation? Write to \u003ca href=\"mailto:admin@rein-protocol.org\" style=\"color:#a83f22;text-decoration:underline;\">admin@rein-protocol.org\u003c/a>.\u003c/p>\n\u003cp style=\"margin:0 0 20px;\">Warmly,\u003cbr>\u003cstrong>Rein Protocol Foundation\u003c/strong>\u003c/p>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:20px 24px 24px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.65;\">\n\u003cp style=\"margin:0 0 10px;\">You received this email because you became a Rein Contributor. Contributor status does not confer legal membership, employment, governance, ownership, or token rights.\u003c/p>\n\u003cp style=\"margin:0;\">\u003ca href=\"https://rein-protocol.org/\" style=\"color:#75695e;\">rein-protocol.org\u003c/a> · \u003ca href=\"https://rein-protocol.org/privacy\" style=\"color:#75695e;\">Privacy\u003c/a>\u003c/p>\n\u003c/td>\u003c/tr>\u003c/table>\n\u003c!--[if mso]>\u003c/td>\u003c/tr>\u003c/table>\u003c![endif]-->\n\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>"},{"id":"contributor-verification","title":"Contributor 邮箱验证","group":"transactional","description":"提交 Contributor 申请后，邀请申请人在 24 小时内验证邮箱。","variables":{"name":"Alex Chen","verificationUrl":"演示验证链接"},"status":"应用邮件","source":"lib/email-templates.ts · contributorVerificationTemplate","subject":"Verify your Rein Contributor application","html":"\u003cp>Hello Alex Chen,\u003c/p>\u003cp>Confirm your email within 24 hours so your Contributor application can enter review.\u003c/p>\u003cp>\u003ca href=\"https://example.invalid/contributor/verify?token=preview-not-valid\">Verify my email\u003c/a>\u003c/p>\u003cp>Most public resources and events are open without becoming a Contributor. Applying is for people who want deeper participation, to organize activities, or to take responsibility for ongoing work.\u003c/p>"},{"id":"application-received","title":"Contributor 申请确认","group":"transactional","description":"邮箱验证完成后确认申请已进入审核，并说明可能的一对一交流。","variables":{"name":"Alex Chen"},"status":"应用邮件","source":"lib/email-templates.ts · applicationReceivedTemplate","subject":"Your Contributor application is in review","html":"\u003cp>Hello Alex Chen,\u003c/p>\u003cp>Your email is verified and your application is now in review. If we invite you to a 1v1, it will be a conversation—not a traditional interview—and will last no more than 30 minutes.\u003c/p>\u003cp>We welcome people across industries, educational backgrounds, and professional paths.\u003c/p>"},{"id":"conversation-invitation","title":"一对一交流邀请","group":"transactional","description":"管理员邀请已验证的申请人选择交流时间；这不是传统面试，最长 30 分钟。","variables":{"name":"Alex Chen","schedulingUrl":"演示预约链接"},"status":"应用邮件","source":"lib/email-templates.ts · conversationInvitationTemplate","subject":"Schedule a Rein Contributor conversation","html":"\u003cp>Hello Alex Chen,\u003c/p>\u003cp>We would like to invite you to a conversational 1v1 meeting. It is not a traditional interview. We will introduce Rein and the community, learn about your interests, discuss possible contribution paths, and answer questions. The conversation will not exceed 30 minutes.\u003c/p>\u003cp>\u003ca href=\"https://example.invalid/schedule\">Choose a time\u003c/a>\u003c/p>\u003cp>We do not record or automatically transcribe these conversations.\u003c/p>"},{"id":"application-rejection","title":"申请审核结果","group":"transactional","description":"申请内容触及沟通与安全标准时通知申请人，并提供人工复核入口。","variables":{"name":"Alex Chen","monitoredEmail":"admin@rein-protocol.org（示例）"},"status":"应用邮件","source":"lib/email-templates.ts · automaticRejectionTemplate","subject":"Update on your Rein Contributor application","html":"\u003cp>Hello Alex Chen,\u003c/p>\u003cp>We cannot move this application forward because its written content appears to conflict with our communication and safety standards.\u003c/p>\u003cp>If you believe this decision is incorrect, contact \u003ca href=\"mailto:admin@rein-protocol.org\">admin@rein-protocol.org\u003c/a>. A person can review and restore the application.\u003c/p>"},{"id":"resource-update","title":"学习资源审核通知","group":"transactional","description":"通知资源提交人审核结果。此处展示 approved 样例，实际结果由发送端传入。","variables":{"title":"A practical guide to AI agents","outcome":"approved"},"status":"应用邮件","source":"lib/email-templates.ts · resourceUpdateTemplate","subject":"Update on your resource submission: A practical guide to AI agents","html":"\u003cp>Thank you for submitting \u003cstrong>A practical guide to AI agents\u003c/strong>.\u003c/p>\u003cp>Review status: approved.\u003c/p>\u003cp>Publication, if approved, credits the resource’s factual author or publisher—not the submitter—and does not automatically create Contributor status.\u003c/p>"},{"id":"identity-link","title":"社区身份关联确认","group":"transactional","description":"关联聊天账号时确认邮箱归属。一次性绑定码在网站确认后显示，不在邮件内发送。","variables":{"receiptUrl":"演示确认链接"},"status":"应用邮件","source":"lib/email-templates.ts · identityLinkReceiptTemplate","subject":"Confirm your Rein Protocol community identity link","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Confirm your Rein community identity link\u003c/title>\u003cstyle>@media only screen and (max-width:480px){.rein-brand{padding:16px 8px 16px 16px!important}.rein-logo-cell{width:48px!important}.rein-mark{width:48px!important;height:48px!important}.rein-wordmark{padding-left:10px!important;font-size:11px!important;letter-spacing:1px!important}.rein-bridge{height:80px!important;background-size:220px 110px!important}}\u003c/style>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background-color:#e8ddc8;color:#302a25;\">\n\u003cdiv style=\"display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;\">Confirm your email address, then return the one-time code to the Rein Agent.\u003c/div>\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#e8ddc8\">\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003c!--[if mso]>\u003ctable role=\"presentation\" width=\"640\" align=\"center\">\u003ctr>\u003ctd>\u003c![endif]-->\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#f5ead3\" style=\"max-width:640px;border:1px solid #d0c3ad;font-family:Arial,sans-serif;\">\n\u003ctr>\u003ctd style=\"border-bottom:1px solid #d5c7b1;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\n\u003ctd class=\"rein-brand\" width=\"65%\" valign=\"middle\" style=\"padding:24px;\">\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\n\u003ctd class=\"rein-logo-cell\" width=\"64\" valign=\"middle\">\u003ca href=\"https://rein-protocol.org/\">\u003cimg class=\"rein-mark\" src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"64\" height=\"64\" alt=\"Rein logo\" style=\"display:block;border:0;width:64px;height:64px;\">\u003c/a>\u003c/td>\n\u003ctd class=\"rein-wordmark\" valign=\"middle\" style=\"padding-left:16px;color:#302a25;font-size:16px;font-weight:bold;letter-spacing:2px;line-height:1.5;\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\n\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd class=\"rein-bridge\" width=\"35%\" height=\"112\" aria-hidden=\"true\" bgcolor=\"#f5ead3\" style=\"height:112px;background-image:url('https://rein-protocol.org/images/welcome-golden-gate-cover.jpg');background-repeat:no-repeat;background-position:10% 58%;background-size:300px 150px;font-size:0;line-height:0;\">&nbsp;\u003c/td>\n\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:28px 24px 20px;\">\n\u003cp style=\"margin:0 0 12px;color:#75695e;font-size:11px;letter-spacing:2px;line-height:1.5;\">ACCOUNT SECURITY\u003c/p>\n\u003ch1 style=\"margin:0;font-family:Georgia,serif;font-size:34px;font-weight:normal;line-height:1.18;color:#302a25;\">Confirm your community identity link.\u003c/h1>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:16px 24px 12px;font-size:15px;line-height:1.75;\">\n\u003cp style=\"margin:0 0 16px;\">Hello,\u003c/p>\n\u003cp style=\"margin:0 0 16px;\">A request was made to connect a chat account to the Rein community identity registered with this email address.\u003c/p>\n\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\u003ctd bgcolor=\"#a83f22\" style=\"border:1px solid #a83f22;mso-padding-alt:13px 22px;\">\u003ca href=\"https://example.invalid/community/link/confirm?receipt=preview-not-valid&amp;session=preview-not-valid\" style=\"display:inline-block;padding:13px 22px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.4;text-decoration:none;\">Confirm on the Rein website →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp style=\"margin:22px 0 16px;\">\u003cstrong>The email does not contain the binding code.\u003c/strong> After you confirm the address on the Rein website, that page will show a short one-time code. Return to the chat and send the code to the Rein Agent to finish linking.\u003c/p>\n\u003cp style=\"margin:0 0 16px;\">This link expires in ten minutes and can be used once. If you did not request it, ignore this message; nothing changes unless the address is confirmed and the code is returned from the requesting chat account.\u003c/p>\n\u003cp style=\"margin:0 0 20px;\">Confirming an address does not by itself create community membership, Contributor status, or governance rights.\u003c/p>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:20px 24px 24px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.65;\">\n\u003cp style=\"margin:0 0 10px;\">You received this security email because someone entered this address in Rein’s account-linking flow.\u003c/p>\n\u003cp style=\"margin:0;\">\u003ca href=\"https://rein-protocol.org/\" style=\"color:#75695e;\">rein-protocol.org\u003c/a> · \u003ca href=\"https://rein-protocol.org/privacy\" style=\"color:#75695e;\">Privacy\u003c/a>\u003c/p>\n\u003c/td>\u003c/tr>\u003c/table>\n\u003c!--[if mso]>\u003c/td>\u003c/tr>\u003c/table>\u003c![endif]-->\n\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>"},{"id":"outreach-ai_startup_founder","title":"AI 创业者","group":"outreach","status":"手动发送","description":"邀请创业者提供技术讲者、非保密演示或其他活动支持。","subject":"Could you support an AI Agent safety workshop?","html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003cbody style=\"margin:0;background:#f5ead3;color:#403830;font-family:Arial,'Avenir Next',sans-serif\">\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:760px;margin:0 auto;background:#f5ead3\">\u003ctr>\u003ctd style=\"padding:22px 34px;border-bottom:1px solid #d5c7b1\">\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"border-collapse:collapse\">\u003ctr>\u003ctd width=\"72\" valign=\"middle\" style=\"width:72px\">\u003cimg src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"72\" height=\"72\" alt=\"\" style=\"display:block;width:72px;height:72px;border:0\">\u003c/td>\u003ctd valign=\"middle\" style=\"padding-left:18px;color:#302a25;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;letter-spacing:2px;line-height:1.55;text-transform:uppercase\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:26px 34px 32px;font-size:15px;line-height:1.75;color:#403830\">\u003cp style=\"margin:0 0 16px\">Hello [Name],\u003c/p>\u003cp style=\"margin:0 0 16px\">I’m reaching out because of [specific product or Agent use case] at [Company]. I’m helping build Rein Protocol Foundation, an independent AI-native nonprofit organization (NPO) focused on public participation in AI Agent safety. Our approach is to use AI Agents to analyze and oversee AI Agents, while making learning and research more accessible.\u003c/p>\u003cp style=\"margin:0 0 16px\">We plan practical workshops at universities and business venues where participants can learn how Agents are built, evaluated and used safely. Our planned AI-native operating model delegates routine community coordination, event preparation and progress reporting to Agents within defined authority limits. People remain responsible for governance, resource allocation, in-person delivery and exceptions.\u003c/p>\u003cp style=\"margin:0 0 16px\">Would your team be willing to contribute a technical speaker and a non-confidential Agent demo for one pilot workshop? A concrete use case and its safety trade-offs would help participants connect research with practice. If a speaker is not feasible, sandbox access or API credits for the workshop would be another useful form of support.\u003c/p>\u003cp style=\"margin:0 0 16px\">A reply indicating which option is feasible would help us plan. If useful, could we spend 15 minutes aligning on the workshop format and support scope?\u003c/p>\u003cp style=\"margin:22px 0 24px\">\u003ca href=\"https://rein-protocol.org\" style=\"display:inline-block;padding:14px 24px;background:#ad3f20;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none\">Explore the Rein community →\u003c/a>\u003c/p>\u003cp style=\"margin:0 0 18px\">Tempest\u003cbr>Founding Board Chair\u003cbr>Rein Protocol Foundation\u003c/p>\u003cp style=\"margin-top:22px;padding-top:12px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.55\">Rein Protocol Foundation was incorporated in Oct 2026 in the STATE OF WYOMING as a nonprofit corporation and has obtained an EIN. Contact: admin@rein-protocol.org. The Agents and programs described are planned work. No company endorsement or affiliation is assumed.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>\n","source":"docs/outreach/ai_startup_founder.eml","variables":{"个性化内容":"保留 [Name] 和其他方括号占位符，发送前按收件人填写。"}},{"id":"outreach-friend-zh","title":"朋友 / 中文","group":"outreach","status":"手动发送","description":"请朋友引荐合适的研究、活动或公益支持伙伴。","subject":"想请你引荐一位支持 AI 公益的伙伴","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cbody style=\"margin:0;background:#f5ead3;color:#403830;font-family:Arial,'Avenir Next',sans-serif\">\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:760px;margin:0 auto;background:#f5ead3\">\u003ctr>\u003ctd style=\"padding:22px 34px;border-bottom:1px solid #d5c7b1\">\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"border-collapse:collapse\">\u003ctr>\u003ctd width=\"72\" valign=\"middle\" style=\"width:72px\">\u003cimg src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"72\" height=\"72\" alt=\"\" style=\"display:block;width:72px;height:72px;border:0\">\u003c/td>\u003ctd valign=\"middle\" style=\"padding-left:18px;color:#302a25;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;letter-spacing:2px;line-height:1.55;text-transform:uppercase\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:26px 34px 32px;font-size:15px;line-height:1.75;color:#403830\">\u003cp style=\"margin:0 0 16px\">嗨 [Name]，\u003c/p>\u003cp style=\"margin:0 0 16px\">想到你在 [相关领域／社群] 的人脉，我想请你帮忙引荐一位可能支持 AI 公益项目的伙伴。我正在参与建设 Rein Protocol Foundation，一个面向 Agent era 的独立 AI-native 非营利组织（NPO），希望让更多公众参与 AI Agent Safety；我们的思路是用 AI Agents 来分析和监督 AI Agents。\u003c/p>\u003cp style=\"margin:0 0 16px\">我们计划提供免费的 AI 学习资源，在高校和商业场景举办工作坊、论文讨论和交流活动，并支持 AI Agent Safety 研究。AI-native 运营模式会让 Agents 在明确权限内承担社群协调、活动筹备和进展整理，人类负责治理、资源分配、线下执行与异常处理。\u003c/p>\u003cp style=\"margin:0 0 16px\">你能否帮我引荐一位关注 AI 安全或教育的研究者、愿意提供讲者或场地的活动伙伴，或有捐赠意向的公益支持者？介绍一位你觉得最合适的人就很有帮助；我可以先发一段简短介绍，由你判断是否适合转发。\u003c/p>\u003cp style=\"margin:0 0 16px\">如果你愿意帮忙，直接回复你想到的人或支持方向即可；需要的话，我们也可以找 15 分钟聊聊。\u003c/p>\u003cp style=\"margin:22px 0 24px\">\u003ca href=\"https://rein-protocol.org\" style=\"display:inline-block;padding:14px 24px;background:#ad3f20;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none\">访问 Rein Protocol 官网 →\u003c/a>\u003c/p>\u003cp style=\"margin:0 0 18px\">Tempest\u003cbr>Founding Board Chair\u003cbr>Rein Protocol Foundation\u003c/p>\u003cp style=\"margin-top:22px;padding-top:12px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.55\">Rein Protocol Foundation 于 Oct 2026在美国怀俄明州（STATE OF WYOMING）注册为非营利法人，并取得 EIN。联系邮箱：admin@rein-protocol.org。Agents 和项目活动仍在建设阶段。\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>\n","source":"docs/outreach/friend-zh.eml","variables":{"个性化内容":"保留 [Name] 和其他方括号占位符，发送前按收件人填写。"}},{"id":"outreach-investor","title":"投资人 / 捐赠者","group":"outreach","status":"手动发送","description":"征询对 $10M 筹款目标的捐赠意向或公益引荐；数字和活动信息仍需发送前核实。","subject":"Would you consider a donation toward our $10M goal?","html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003cbody style=\"margin:0;background:#f5ead3;color:#403830;font-family:Arial,'Avenir Next',sans-serif\">\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:760px;margin:0 auto;background:#f5ead3\">\u003ctr>\u003ctd style=\"padding:22px 34px;border-bottom:1px solid #d5c7b1\">\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"border-collapse:collapse\">\u003ctr>\u003ctd width=\"72\" valign=\"middle\" style=\"width:72px\">\u003cimg src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"72\" height=\"72\" alt=\"\" style=\"display:block;width:72px;height:72px;border:0\">\u003c/td>\u003ctd valign=\"middle\" style=\"padding-left:18px;color:#302a25;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;letter-spacing:2px;line-height:1.55;text-transform:uppercase\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:26px 34px 32px;font-size:15px;line-height:1.75;color:#403830\">\u003cp style=\"margin:0 0 16px\">Dear [Name],\u003c/p>\u003cp style=\"margin:0 0 16px\">I’m reaching out because of your support for [specific public-interest initiative or relevant focus]. I’m helping build Rein Protocol Foundation, an independent AI-native nonprofit organization (NPO) focused on public participation in AI Agent safety. Our approach is to use AI Agents to analyze and oversee AI Agents, while making learning and research more accessible.\u003c/p>\u003cp style=\"margin:0 0 16px\">We are building our initial community, with [verified founding-team headcount] people on the founding team and [verified community member count, as of date] community members. Our planned AI-native operating model delegates routine community coordination, event preparation and progress reporting to Agents within defined authority limits. People remain responsible for governance, resource allocation, in-person delivery and exceptions.\u003c/p>\u003cp style=\"margin:0 0 16px\">We plan university and business-venue workshops, paper discussions and practitioner meetups that bring researchers, founders, investors and newcomers together. Our initial event plan is [location, proposed cadence and expected attendance; distinguish plans from confirmed bookings].\u003c/p>\u003cp style=\"margin:0 0 16px\">Our fundraising target is $10M to support free AI learning resources, in-person programs, AI Agent Safety research and the infrastructure needed to operate and report on this work. This is a donation-oriented public-benefit effort, not an equity investment or a promise of financial or token returns.\u003c/p>\u003cp style=\"margin:0 0 16px\">Would you consider making a donation toward this goal once our fundraising channels are approved? If donations are outside your mandate, could you introduce us to a philanthropist or foundation that supports AI safety or education?\u003c/p>\u003cp style=\"margin:0 0 16px\">A brief reply about donation interest would be very helpful. I can share a proposed budget and program plan; if useful, could we discuss them for 15 minutes?\u003c/p>\u003cp style=\"margin:22px 0 24px\">\u003ca href=\"https://rein-protocol.org\" style=\"display:inline-block;padding:14px 24px;background:#ad3f20;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none\">Explore the Rein community →\u003c/a>\u003c/p>\u003cp style=\"margin:0 0 18px\">Tempest\u003cbr>Founding Board Chair\u003cbr>Rein Protocol Foundation\u003c/p>\u003cp style=\"margin-top:22px;padding-top:12px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.55\">Rein Protocol Foundation was incorporated in Oct 2026 in the STATE OF WYOMING as a nonprofit corporation and has obtained an EIN. Contact: admin@rein-protocol.org. The Agents and programs described are planned work. We are not offering a commercial investment or token return. Fundraising channels still require approval.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>\n","source":"docs/outreach/investor.eml","variables":{"个性化内容":"保留 [Name] 和其他方括号占位符，发送前按收件人填写。"}},{"id":"outreach-professor","title":"教授 / Academic","group":"outreach","status":"手动发送","description":"邀请教授审阅研究议程、建议优先方向，或引荐研究与活动伙伴。","subject":"Help shape our AI Agent safety research agenda","html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003cbody style=\"margin:0;background:#f5ead3;color:#403830;font-family:Arial,'Avenir Next',sans-serif\">\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:760px;margin:0 auto;background:#f5ead3\">\u003ctr>\u003ctd style=\"padding:22px 34px;border-bottom:1px solid #d5c7b1\">\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"border-collapse:collapse\">\u003ctr>\u003ctd width=\"72\" valign=\"middle\" style=\"width:72px\">\u003cimg src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"72\" height=\"72\" alt=\"\" style=\"display:block;width:72px;height:72px;border:0\">\u003c/td>\u003ctd valign=\"middle\" style=\"padding-left:18px;color:#302a25;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;letter-spacing:2px;line-height:1.55;text-transform:uppercase\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:26px 34px 32px;font-size:15px;line-height:1.75;color:#403830\">\u003cp style=\"margin:0 0 16px\">Dear [Name],\u003c/p>\u003cp style=\"margin:0 0 16px\">I’m reaching out because of your work on [specific research area or paper]. I’d like your help shaping the research agenda for Rein Protocol Foundation, an independent AI-native nonprofit organization (NPO) focused on public participation in AI Agent safety.\u003c/p>\u003cp style=\"margin:0 0 16px\">We plan free learning resources and university-based paper discussions and workshops that connect researchers with students and practitioners. Our approach is to use AI Agents to analyze and oversee AI Agents. Our planned AI-native operating model delegates routine community coordination, event preparation and progress reporting to Agents within defined authority limits. People remain responsible for governance, resource allocation, in-person delivery and exceptions.\u003c/p>\u003cp style=\"margin:0 0 16px\">Would you be willing to review a one-page research agenda and suggest one or two priorities where a public-interest organization could contribute? If there is a fit, we would also welcome an introduction to a relevant lab or a researcher interested in advising a pilot workshop.\u003c/p>\u003cp style=\"margin:0 0 16px\">I can send the agenda for an asynchronous review; if a conversation is easier, would you be available for 15 minutes?\u003c/p>\u003cp style=\"margin:22px 0 24px\">\u003ca href=\"https://rein-protocol.org\" style=\"display:inline-block;padding:14px 24px;background:#ad3f20;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none\">Explore the Rein community →\u003c/a>\u003c/p>\u003cp style=\"margin:0 0 18px\">Tempest\u003cbr>Founding Board Chair\u003cbr>Rein Protocol Foundation\u003c/p>\u003cp style=\"margin-top:22px;padding-top:12px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.55\">Rein Protocol Foundation was incorporated in Oct 2026 in the STATE OF WYOMING as a nonprofit corporation and has obtained an EIN. Contact: admin@rein-protocol.org. The Agents and programs described are planned work.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>\n","source":"docs/outreach/professor.eml","variables":{"个性化内容":"保留 [Name] 和其他方括号占位符，发送前按收件人填写。"}},{"id":"outreach-researcher","title":"AI 研究者","group":"outreach","status":"手动发送","description":"邀请研究者审阅试点提纲，建议评估方法或开放基准。","subject":"Help define a pilot AI Agent safety evaluation","html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003cbody style=\"margin:0;background:#f5ead3;color:#403830;font-family:Arial,'Avenir Next',sans-serif\">\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:760px;margin:0 auto;background:#f5ead3\">\u003ctr>\u003ctd style=\"padding:22px 34px;border-bottom:1px solid #d5c7b1\">\u003ctable role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"border-collapse:collapse\">\u003ctr>\u003ctd width=\"72\" valign=\"middle\" style=\"width:72px\">\u003cimg src=\"https://rein-protocol.org/brand/rein-mark-header.png\" width=\"72\" height=\"72\" alt=\"\" style=\"display:block;width:72px;height:72px;border:0\">\u003c/td>\u003ctd valign=\"middle\" style=\"padding-left:18px;color:#302a25;font-family:Arial,sans-serif;font-size:18px;font-weight:bold;letter-spacing:2px;line-height:1.55;text-transform:uppercase\">REIN PROTOCOL\u003cbr>FOUNDATION\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:26px 34px 32px;font-size:15px;line-height:1.75;color:#403830\">\u003cp style=\"margin:0 0 16px\">Hello [Name],\u003c/p>\u003cp style=\"margin:0 0 16px\">I’m reaching out because of your work on [specific paper, benchmark or project]. I’m helping build Rein Protocol Foundation, an independent AI-native nonprofit organization (NPO) focused on public participation in AI Agent safety. Our approach is to use AI Agents to analyze and oversee AI Agents, while making learning and research more accessible.\u003c/p>\u003cp style=\"margin:0 0 16px\">We would like to start with a focused research pilot on [specific Agent safety question], supported by open learning materials and small research discussions. Our planned AI-native operating model delegates routine community coordination, event preparation and progress reporting to Agents within defined authority limits. People remain responsible for governance, resource allocation, in-person delivery and exceptions.\u003c/p>\u003cp style=\"margin:0 0 16px\">Would you be willing to review a one-page pilot outline and recommend an evaluation method or an openly available benchmark? Our immediate goal is to identify a useful, feasible question—not to ask for an open-ended research commitment. If there is mutual interest, we can separately define a collaboration scope and how contributions would be credited.\u003c/p>\u003cp style=\"margin:0 0 16px\">I can send the outline for written feedback, or we could spend 15 minutes discussing it. Which would you prefer?\u003c/p>\u003cp style=\"margin:22px 0 24px\">\u003ca href=\"https://rein-protocol.org\" style=\"display:inline-block;padding:14px 24px;background:#ad3f20;color:#ffffff;font-size:15px;font-weight:700;line-height:1.4;text-decoration:none\">Explore the Rein community →\u003c/a>\u003c/p>\u003cp style=\"margin:0 0 18px\">Tempest\u003cbr>Founding Board Chair\u003cbr>Rein Protocol Foundation\u003c/p>\u003cp style=\"margin-top:22px;padding-top:12px;border-top:1px solid #d5c7b1;color:#75695e;font-size:11px;line-height:1.55\">Rein Protocol Foundation was incorporated in Oct 2026 in the STATE OF WYOMING as a nonprofit corporation and has obtained an EIN. Contact: admin@rein-protocol.org. The Agents and programs described are planned work.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>\n","source":"docs/outreach/researcher.eml","variables":{"个性化内容":"保留 [Name] 和其他方括号占位符，发送前按收件人填写。"}},{"id":"auth-confirmation-link","title":"注册邮箱确认 · 链接","group":"auth","status":"账号安全","description":"新账号确认邮箱。展示 Rein 确认页链接，以及手动打开链接的说明。","subject":"Confirm your email — Rein Protocol Foundation","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Confirm your email address.\u003c/title>\u003cstyle>@media only screen and (max-width:480px){.rein-brand{padding:16px 8px 16px 16px!important}.rein-logo-cell{width:48px!important}.rein-mark{width:48px!important;height:48px!important}.rein-wordmark{padding-left:10px!important;font-size:11px!important;letter-spacing:1px!important}.rein-bridge{height:80px!important;background-size:220px 110px!important}}\u003c/style>\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background-color:#e8ddc8;color:#302a25;\">\n\u003cdiv style=\"display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;\">Confirm your email address to continue with Rein.\u003c/div>\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#e8ddc8\">\u003ctr>\u003ctd align=\"center\" style=\"padding:24px 12px;\">\n\u003c!--[if mso]>\u003ctable r <script>
'use strict';
const {catalog, assets} = JSON.parse(document.getElementById('email-data').textContent);
const groups = [['welcome','欢迎邮件'],['outreach','Outreach · 对外联络'],['transactional','社区业务通知'],['auth','账号安全']];
const byId = (id) => document.getElementById(id);
const frame = byId('preview');
let selected = null;
let observer;
let sizeFrame;
byId('total').textContent = catalog.length;
function element(tag, text, className) { const el=document.createElement(tag); if(text)el.textContent=text; if(className)el.className=className; return el; }
function renderNavigation() {
  const query=byId('search').value.trim().toLocaleLowerCase();
  const matches=catalog.filter(email=>[email.title,email.description,email.subject,email.source,email.status].join(' ').toLocaleLowerCase().includes(query));
  byId('navigation').replaceChildren();
  for(const [key,label] of groups){
    const emails=matches.filter(email=>email.group===key);
    if(!emails.length)continue;
    const section=element('section',null,'nav-group');
    const heading=element('h2',label);heading.append(element('span',String(emails.length)));section.append(heading);
    for(const email of emails){
      const button=element('button',email.title,'template-button');button.type='button';button.dataset.id=email.id;
      if(email.id===selected)button.setAttribute('aria-current','page');
      button.addEventListener('click',()=>selectEmail(email.id));section.append(button);
    }
    byId('navigation').append(section);
  }
  byId('empty').hidden=matches.length>0;
  byId('search-count').textContent=query ? `${matches.length} / ${catalog.length} 个匹配模板` : `${catalog.length} 个模板与变体 · 选择一封开始审阅`;
}
function previewHtml(original){
  let html=original;
  for(const [url,data] of Object.entries(assets))html=html.replaceAll(url,data);
  const policy='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data:; style-src \'unsafe-inline\'; base-uri \'none\'; form-action \'none\'">';
  if(/<head[\s>]/i.test(html))return html.replace(/<head[^>]*>/i,match=>match+policy);
  if(/<html[\s>]/i.test(html))return html.replace(/<html[^>]*>/i,match=>match+'<head>'+policy+'</head>');
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+policy+'</head><body>'+html+'</body></html>';
}
function selectEmail(id){
  const email=catalog.find(item=>item.id===id)||catalog[0];selected=email.id;
  history.replaceState(null,'','#'+email.id);
  document.querySelectorAll('.template-button').forEach(button=>{if(button.dataset.id===selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
  byId('template-title').textContent=email.title;byId('description').textContent=email.description;byId('subject').textContent=email.subject;
  byId('status').textContent=email.status;byId('status').classList.toggle('pending',email.id==='contributor-welcome');
  byId('source').textContent='来源：'+email.source;
  byId('variables').replaceChildren();
  for(const [key,value] of Object.entries(email.variables))byId('variables').append(element('dt',key),element('dd',value));
  byId('link-target').hidden=true;
  const documentCopy=new DOMParser().parseFromString(email.html,'text/html');
  byId('links').replaceChildren();
  const links=[...documentCopy.querySelectorAll('a[href]')];
  for(const link of links){const row=element('li');row.append(element('strong',link.textContent.trim()||link.querySelector('img')?.alt||'图片链接'),element('code',link.getAttribute('href')));byId('links').append(row);}
  byId('link-count').textContent='('+links.length+')';
  if(observer)observer.disconnect();
  sizeFrame=null;frame.style.height='100px';frame.title=email.title+' 邮件预览';frame.srcdoc=previewHtml(email.html);
}
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;if(!doc?.body)return;
  sizeFrame=()=>{const style=frame.contentWindow.getComputedStyle(doc.body);const margins=parseFloat(style.marginTop)+parseFloat(style.marginBottom);const height=Math.ceil(Math.max(doc.body.getBoundingClientRect().height,doc.body.scrollHeight)+margins+2);frame.style.height=height+'px';};
  observer=new ResizeObserver(sizeFrame);observer.observe(doc.body);sizeFrame();
  doc.addEventListener('click',event=>{const link=event.target.closest('a');if(link){event.preventDefault();byId('link-target').textContent='链接目标：'+link.getAttribute('href');byId('link-target').hidden=false;}});
  doc.addEventListener('submit',event=>event.preventDefault());
});
function setWidth(mobile){byId('frame-wrap').classList.toggle('mobile',mobile);byId('mobile').setAttribute('aria-pressed',String(mobile));byId('desktop').setAttribute('aria-pressed',String(!mobile));requestAnimationFrame(()=>sizeFrame?.());}
byId('desktop').addEventListener('click',()=>setWidth(false));byId('mobile').addEventListener('click',()=>setWidth(true));
byId('search').addEventListener('input',renderNavigation);
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(catalog.some(email=>email.id===id))selectEmail(id);});
renderNavigation();selectEmail(location.hash.slice(1));
</script>
</body>
</html>
